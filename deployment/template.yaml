Transform: AWS::Serverless-2016-10-31
Description: Slide Quiz serverless API (FastAPI on Lambda)

Parameters:
  CsvBucketName:
    Type: String
    Description: クイズCSVを保存しているS3バケット名
  CsvObjectKey:
    Type: String
    Description: 上記バケット内のCSVオブジェクトキー
  ImagesBaseUrl:
    Type: String
    Description: 画像を配信するCloudFrontもしくはS3静的URL（末尾にディレクトリパスを含める）
  ImageExtension:
    Type: String
    Default: png
    Description: 画像ファイルの拡張子（ドットなし）
  CognitoUserPoolId:
    Type: String
    Description: 認証に使用するCognitoユーザープールID
    Default: us-east-1_I9CyURMHE
  CognitoUserPoolClientId:
    Type: String
    Description: 認証に使用するCognitoアプリクライアントID
    Default: 7bmla7ef7gn54hnik43b3glqa2
  ProvisionedConcurrency:
    Type: Number
    Default: 1
    Description: Lambdaをウォーム状態で維持するためのプロビジョンド同時実行数（0で無効）

Conditions:
  UseProvisionedConcurrency: !Not [!Equals [!Ref ProvisionedConcurrency, 0]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 512
    Architectures:
      - x86_64

Resources:
  SlideQuizHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - "*"

  SlideQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: app.main.handler
      Description: FastAPI backend for Slide Quiz
      Environment:
        Variables:
          CSV_S3_BUCKET: !Ref CsvBucketName
          CSV_S3_KEY: !Ref CsvObjectKey
          IMAGES_BASE_URL: !Ref ImagesBaseUrl
          IMAGE_EXTENSION: !Ref ImageExtension
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_APP_CLIENT_ID: !Ref CognitoUserPoolClientId
          COGNITO_REGION: us-east-1
          SESSION_TABLE_NAME: slidequiz-api-SessionSummary
          USER_STATS_TABLE_NAME: slidequiz-api-UserStats
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref SlideQuizHttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref CsvBucketName
        - DynamoDBCrudPolicy:
            TableName: slidequiz-api-SessionSummary
        - DynamoDBCrudPolicy:
            TableName: slidequiz-api-UserStats
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig: !If
        - UseProvisionedConcurrency
        - { ProvisionedConcurrentExecutions: !Ref ProvisionedConcurrency }
        - !Ref AWS::NoValue
    Metadata:
      BuildMethod: python3.12

Outputs:
  ApiUrl:
    Description: デプロイされたAPIのエンドポイントURL
    Value: !Sub "https://${SlideQuizHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  SessionTableNameOutput:
    Description: セッション履歴を保存するDynamoDBテーブル名
    Value: slidequiz-api-SessionSummary
  UserStatsTableNameOutput:
    Description: ユーザー集計情報を保存するDynamoDBテーブル名
    Value: slidequiz-api-UserStats
