<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スライド改善 学習デモ</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root"></div>

  <!-- React & Babel (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    window.API_BASE = window.API_BASE || 'https://7o5rfdhfxc.execute-api.ap-northeast-1.amazonaws.com';
  </script>

  <!-- App Code -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // APIベースURL: 同一オリジンで配信中は相対、file:// などではローカルAPIにフォールバック
    const API_BASE = window.API_BASE || (location.origin && location.origin.startsWith('http') ? '' : 'http://127.0.0.1:8000');

    const resolveUrl = (path) => {
      if (!path) return null;
      if (/^https?:\/\//.test(path)) return path;
      return `${API_BASE}${path}`;
    };

    // 認証関連のユーティリティ（グローバルスコープに公開）
    const AUTH_UTILS = {
      // Cognito Hosted UI の URL
      COGNITO_LOGIN_URL: 'https://us-east-1i9cyurmhe.auth.us-east-1.amazoncognito.com/login?client_id=7bmla7ef7gn54hnik43b3glqa2&response_type=code&scope=email+openid+phone&redirect_uri=https://app2.rubato.co/auth/callback',
      
      // セッションストレージからトークンを取得
      getIdToken() {
        return window.sessionStorage.getItem('auth.idToken');
      },
      
      // JWT のペイロードを取り出す（有効期限チェック用）
      _parseJwt(token) {
        if (!token) return null;
        try {
          const payload = token.split('.')[1];
          const normalized = payload.replace(/-/g, '+').replace(/_/g, '/');
          const decoded = atob(normalized.padEnd(normalized.length + (4 - normalized.length % 4) % 4, '='));
          return JSON.parse(decoded);
        } catch (err) {
          console.warn('Failed to parse JWT payload', err);
          return null;
        }
      },

      _isTokenExpired(token) {
        const payload = this._parseJwt(token);
        if (!payload || !payload.exp) return true;
        const now = Math.floor(Date.now() / 1000);
        return payload.exp <= now + 60; // 余裕を持って60秒前に更新
      },

      async _refreshTokens() {
        const refreshToken = window.sessionStorage.getItem('auth.refreshToken');
        if (!refreshToken) {
          console.warn('Missing refresh token');
          return null;
        }

        try {
          const response = await fetch('https://us-east-1i9cyurmhe.auth.us-east-1.amazoncognito.com/oauth2/token', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'Authorization': 'Basic ' + btoa('7bmla7ef7gn54hnik43b3glqa2:1bq57lfeujhkksv8n81j1q9mcft42lb2alc8gmtuh2kpii36vqir')
            },
            body: new URLSearchParams({
              grant_type: 'refresh_token',
              refresh_token: refreshToken
            })
          });

          if (!response.ok) {
            console.error('Token refresh failed:', response.status);
            return null;
          }

          const data = await response.json();
          if (data.id_token) {
            window.sessionStorage.setItem('auth.idToken', data.id_token);
          }
          if (data.access_token) {
            window.sessionStorage.setItem('auth.accessToken', data.access_token);
          }
          if (data.refresh_token) {
            window.sessionStorage.setItem('auth.refreshToken', data.refresh_token);
          }
          const latestIdToken = data.id_token || window.sessionStorage.getItem('auth.idToken');
          if (latestIdToken) {
            window.dispatchEvent(new CustomEvent('auth:tokenRefreshed', { detail: { idToken: latestIdToken } }));
          }
          return latestIdToken;
        } catch (error) {
          console.error('Token refresh error:', error);
          return null;
        }
      },

      async ensureValidToken() {
        const token = this.getIdToken();
        if (!token) return null;
        if (!this._isTokenExpired(token)) {
          return token;
        }
        return await this._refreshTokens();
      },

      // セッションストレージからauth.codeを取得してトークン交換
      async exchangeCodeForToken() {
        const code = window.sessionStorage.getItem('auth.code');
        if (!code) return null;
        
        try {
          const response = await fetch('https://us-east-1i9cyurmhe.auth.us-east-1.amazoncognito.com/oauth2/token', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'Authorization': 'Basic ' + btoa('7bmla7ef7gn54hnik43b3glqa2:1bq57lfeujhkksv8n81j1q9mcft42lb2alc8gmtuh2kpii36vqir')
            },
            body: new URLSearchParams({
              grant_type: 'authorization_code',
              code: code,
              redirect_uri: 'https://app2.rubato.co/auth/callback'
            })
          });
          
          if (!response.ok) {
            console.error('Token exchange failed:', response.status);
            return null;
          }
          
          const data = await response.json();
          // トークンをセッションストレージに保存
          window.sessionStorage.setItem('auth.idToken', data.id_token);
          window.sessionStorage.setItem('auth.accessToken', data.access_token);
          if (data.refresh_token) {
            window.sessionStorage.setItem('auth.refreshToken', data.refresh_token);
          }
          // codeは使い捨てなので削除
          window.sessionStorage.removeItem('auth.code');

          if (data.id_token) {
            window.dispatchEvent(new CustomEvent('auth:tokenRefreshed', { detail: { idToken: data.id_token } }));
          }
          return data.id_token;
        } catch (error) {
          console.error('Token exchange error:', error);
          return null;
        }
      },
      
      // 認証済みかチェック
      isAuthenticated() {
        return !!this.getIdToken();
      },
      
      // ログインページにリダイレクト
      redirectToLogin() {
        window.location.href = this.COGNITO_LOGIN_URL;
      },
      
      // ログアウト
      logout() {
        window.sessionStorage.removeItem('auth.idToken');
        window.sessionStorage.removeItem('auth.accessToken');
        window.sessionStorage.removeItem('auth.refreshToken');
        window.sessionStorage.removeItem('auth.code');
        window.dispatchEvent(new CustomEvent('auth:tokenRefreshed', { detail: { idToken: null } }));
      }
    };
    
    // グローバルスコープに公開（開発者ツールから使えるように）
    window.AUTH_UTILS = AUTH_UTILS;

    const fetchWithAuth = async (input, init = {}, attempt = 0) => {
      const token = await AUTH_UTILS.ensureValidToken();
      if (!token) {
        throw new Error('認証が必要です');
      }

      const headers = new Headers(init.headers || {});
      headers.set('Authorization', `Bearer ${token}`);
      const response = await fetch(input, { ...init, headers });

      if (response.status === 401 && attempt === 0) {
        const refreshed = await AUTH_UTILS._refreshTokens();
        if (refreshed) {
          return fetchWithAuth(input, init, attempt + 1);
        }
      }

      return response;
    };

    // 進行状況表示用コンポーネント
    function ProgressInfo({ current, total, perSet }) {
      const sets = Math.ceil(total / perSet);
      const cur = Math.min(current, total);
      const setNo = Math.ceil(cur / perSet) || 1;
      const qInSet = ((cur - 1) % perSet) + 1;
      const pct = total > 0 ? Math.round((cur / total) * 100) : 0;
      return (
        <div className="mb-2">
          <div className="text-sm text-center text-gray-700">
            セット {setNo}/{sets} ・ 問題 {qInSet}/{perSet} ・ 合計 {cur}/{total}
          </div>
          <div className="h-2 bg-gray-200 rounded mt-1 overflow-hidden">
            <div className="h-full bg-indigo-500" style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    // 出題ページ
    function QuizPage({ quiz, selected, toggle, submit, loading, error, progress, onShowMyPage, isAuthenticated }) {
      const imageSrc = resolveUrl(quiz?.image_url);
      const bottomRef = React.useRef(null);
      const [barHeight, setBarHeight] = React.useState(160);
      const gridRef = React.useRef(null);
      const [gridColsStyle, setGridColsStyle] = React.useState(null);

      React.useEffect(() => {
        const el = bottomRef.current;
        if (!el) return;
        const measure = () => {
          const h = Math.ceil(el.offsetHeight || el.getBoundingClientRect().height || 160);
          // 余白の取り切れないケースを避けるため、数pxバッファを足す
          setBarHeight(h + 8);
        };
        measure();
        let ro;
        if (typeof ResizeObserver !== 'undefined') {
          ro = new ResizeObserver(() => measure());
          ro.observe(el);
        }
        const onResize = () => measure();
        window.addEventListener('resize', onResize);
        // 内容変化直後のレイアウト確定後にも再測定
        const raf = requestAnimationFrame(measure);
        return () => {
          if (ro) ro.disconnect();
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(raf);
        };
      }, [quiz, selected]);

      // 最大幅時に2行に揃える: 十分な横幅がある場合は列数=ceil(N/2)を強制
      React.useEffect(() => {
        const el = gridRef.current;
        const items = quiz?.improvements || [];
        if (!el || items.length === 0) return setGridColsStyle(null);

        const MIN_COL_PX = 140; // ボタンの最小横幅（可読性確保）
        const apply = () => {
          const w = el.clientWidth || el.getBoundingClientRect().width || 0;
          const desiredCols = Math.ceil(items.length / 2);
          const colWidth = desiredCols > 0 ? w / desiredCols : w;
          if (colWidth >= MIN_COL_PX) {
            setGridColsStyle({ gridTemplateColumns: `repeat(${desiredCols}, minmax(0, 1fr))` });
          } else {
            setGridColsStyle(null); // 狭いときは通常のレスポンシブ列数に任せる
          }
        };
        apply();
        const onResize = () => apply();
        window.addEventListener('resize', onResize);
        const raf = requestAnimationFrame(apply);
        return () => {
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(raf);
        };
      }, [quiz]);
      return (
        <div className="relative w-full max-w-3xl mx-auto pt-3">
          {/* ヘッダー: 進行状況とマイページボタン */}
          <div className="flex justify-between items-center mb-2 px-4">
            <div className="flex-grow">
              <ProgressInfo current={progress?.current ?? 1} total={progress?.total ?? 15} perSet={progress?.perSet ?? 5} />
            </div>
            {isAuthenticated && onShowMyPage && (
              <button 
                onClick={onShowMyPage}
                className="ml-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-full text-sm transition"
              >
                マイページ
              </button>
            )}
          </div>
          {/* 問題ID（検証用表示） */}
          <p className="text-sm text-center text-gray-600 mb-2">問題ID: {quiz?.id || '-'}</p>
          {loading ? (
            <div className="w-full h-64 flex items-center justify-center text-gray-600">読み込み中...</div>
          ) : error ? (
            <div className="w-full h-64 flex items-center justify-center text-red-600">{error}</div>
          ) : (
            <img src={imageSrc} alt="問題スライド" className="w-full h-auto shadow" />
          )}

          {/* 固定ボトムバーの高さだけダミースペースを確保し、画像下部が隠れないようにする */}
          <div aria-hidden="true" style={{ height: `${barHeight}px` }} />

          {/* 下部固定 UI（改善項目グリッド + 回答ボタン） */}
          <div ref={bottomRef} className="fixed inset-x-0 bottom-0 z-30 bg-white/90 backdrop-blur border-t border-gray-200">
            <div className="w-full max-w-3xl mx-auto px-4 pt-3 pb-3 pb-[env(safe-area-inset-bottom)]">
              {/* 改善項目グリッド: 2→3→4列（通常）。十分広い場合はJSで2行になる列数に自動調整 */}
              <div ref={gridRef} className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 auto-rows-fr" style={gridColsStyle || undefined}>
                {(quiz?.improvements || []).map((item) => {
                  const isSelected = selected.includes(item);
                  return (
                    <div className="h-full" key={item}>
                      <button
                        type="button"
                        aria-pressed={isSelected}
                        onClick={() => toggle(item)}
                        className={
                          `w-full h-full min-h-12 px-3 py-2 rounded-md shadow transition text-sm leading-tight break-words focus:outline-none focus-visible:outline-2 focus-visible:outline-offset-2 ` +
                          (isSelected
                            ? 'bg-orange-600 text-white ring-2 ring-orange-700 focus-visible:outline-orange-700'
                            : 'bg-orange-300 text-gray-800 focus-visible:outline-orange-500')
                        }
                      >
                        {item}
                      </button>
                    </div>
                  );
                })}
              </div>

              {/* 回答ボタン（セーフエリア対応） */}
              <div className="mt-3 flex justify-center">
                <button
                  onClick={submit}
                  className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-full shadow-lg text-lg"
                >
                  回答する
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 評価ページ
    function EvaluationPage({ quiz, gradeResult, next, progress, isLast }) {
      const rows = gradeResult?.rows || [];
      const score = gradeResult?.score ?? 0;
      const total = gradeResult?.total ?? (quiz?.improvements?.length || 0);
      const bottomRef = React.useRef(null);
      const [barHeight, setBarHeight] = React.useState(120);

      React.useEffect(() => {
        const el = bottomRef.current;
        if (!el) return;
        const measure = () => {
          const h = Math.ceil(el.offsetHeight || el.getBoundingClientRect().height || 120);
          setBarHeight(h + 8);
        };
        measure();
        let ro;
        if (typeof ResizeObserver !== 'undefined') {
          ro = new ResizeObserver(() => measure());
          ro.observe(el);
        }
        const onResize = () => measure();
        window.addEventListener('resize', onResize);
        const raf = requestAnimationFrame(measure);
        return () => {
          if (ro) ro.disconnect();
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(raf);
        };
      }, [rows]);

      return (
        <div className="relative w-full max-w-3xl mx-auto pt-4">
          {/* 進行状況（回答後なので current は回答済み数）*/}
          <ProgressInfo current={progress?.current ?? 1} total={progress?.total ?? 15} perSet={progress?.perSet ?? 5} />
          {/* 見出し */}
          <h1 className="text-2xl font-bold text-center mb-2">問題ID: {quiz?.id || '-'}</h1>

          {/* スライド画像 */}
          {quiz?.image_url && (
            <img src={resolveUrl(quiz.image_url)} alt="問題スライド" className="w-full h-auto shadow" />
          )}

          {/* 評価テーブル */}
          <div className="overflow-x-auto mt-6">
            <table className="table-auto w-full text-center border border-gray-400">
              <thead className="bg-gray-100">
                <tr>
                  <th className="border border-gray-400 px-2 py-1">改善項目</th>
                  <th className="border border-gray-400 px-2 py-1">回答</th>
                  <th className="border border-gray-400 px-2 py-1">正解</th>
                  <th className="border border-gray-400 px-2 py-1">✓/✕</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(({ item, answered, correct, is_wrong }) => (
                  <tr key={item} className={is_wrong ? 'bg-red-200' : ''}>
                    <td className="border border-gray-400 px-1 py-1 text-left">{item}</td>
                    <td className="border border-gray-400 px-2 py-1">{answered ? '○' : 'ー'}</td>
                    <td className="border border-gray-400 px-2 py-1">{correct ? '○' : 'ー'}</td>
                    <td className="border border-gray-400 px-2 py-1">
                      {is_wrong ? '✕' : '✓'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* 正解数 */}
          <p className="mt-6 text-3xl font-extrabold text-center text-indigo-700">
            あなたの正解数は {score}/{total}
          </p>

          {/* 次の問題へ */}
          {/* 固定ボタンの高さ分のスペースを確保 */}
          <div aria-hidden="true" style={{ height: `${barHeight}px` }} />

          <div ref={bottomRef} className="fixed inset-x-0 bottom-0 z-30 bg-white/90 backdrop-blur border-t border-gray-200">
            <div className="w-full max-w-3xl mx-auto px-4 pt-3 pb-3 pb-[env(safe-area-inset-bottom)] flex justify-center">
              <button
                onClick={next}
                className="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-semibold px-8 py-3 rounded-full shadow-lg text-lg"
              >
                {isLast ? '総合評価へ' : '次の問題に進む'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // マイページコンポーネント
    function MyPage({ idToken, onBackToQuiz }) {
      const [stats, setStats] = useState(null);
      const [sessionHistory, setSessionHistory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const getImprovementEntries = React.useCallback((rawStats) => {
        if (!rawStats || !rawStats.improvement_item_stats) return [];
        return Object.entries(rawStats.improvement_item_stats).map(([label, counters]) => {
          const attempts = counters?.attempts ?? 0;
          const correct = counters?.correct ?? 0;
          const accuracy = attempts > 0 ? Math.round((correct / attempts) * 100) : 0;
          let status = '要復習';
          let tone = 'bg-red-100 text-red-700 border-red-200';
          if (accuracy >= 80) {
            status = '得意';
            tone = 'bg-green-100 text-green-700 border-green-200';
          } else if (accuracy >= 70) {
            status = '伸びしろ';
            tone = 'bg-yellow-100 text-yellow-700 border-yellow-200';
          }
          return {
            label,
            attempts,
            correct,
            accuracy,
            status,
            tone
          };
        });
      }, []);
      const improvementEntries = getImprovementEntries(stats);
      
      useEffect(() => {
        const fetchData = async () => {
          setLoading(true);
          setError(null);

          try {
            const token = await AUTH_UTILS.ensureValidToken();
            if (!token) {
              throw new Error('認証が必要です');
            }

            const statsRes = await fetchWithAuth(`${API_BASE}/api/stats`);

            if (statsRes.status === 401) {
              throw new Error('認証情報の有効期限が切れました。再ログインしてください。');
            }

            if (!statsRes.ok) {
              throw new Error(`Failed to fetch stats: ${statsRes.status}`);
            }

            const statsData = await statsRes.json();
            setStats(statsData.stats);
            setSessionHistory(statsData.recent_sessions || []);
          } catch (e) {
            setError(e.message || 'データの取得に失敗しました');
          } finally {
            setLoading(false);
          }
        };
        
        fetchData();
      }, [idToken]);
      
      if (loading) {
        return (
          <div className="w-full max-w-3xl mx-auto pt-6 pb-6 text-center">
            <div className="text-gray-600">読み込み中...</div>
          </div>
        );
      }
      
      if (error) {
        return (
          <div className="w-full max-w-3xl mx-auto pt-6 pb-6">
            <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
              {error}
            </div>
            <button onClick={onBackToQuiz} className="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-full">
              クイズに戻る
            </button>
          </div>
        );
      }
      
      return (
        <div className="w-full max-w-3xl mx-auto pt-6 pb-6 px-4">
          <div className="flex justify-between items-center mb-6">
            <h1 className="text-2xl font-bold">マイページ</h1>
            <button onClick={onBackToQuiz} className="bg-gray-600 hover:bg-gray-700 text-white font-semibold px-4 py-2 rounded-full text-sm">
              クイズに戻る
            </button>
          </div>
          
          {/* 統計情報 */}
          {stats && (
            <div className="bg-white rounded-lg shadow p-6 mb-6">
              <h2 className="text-xl font-semibold mb-4">学習統計</h2>
              <div className="grid grid-cols-2 gap-4">
                <div className="bg-indigo-50 p-4 rounded">
                  <div className="text-sm text-gray-600">総セッション数</div>
                  <div className="text-2xl font-bold text-indigo-700">{stats.total_sessions}</div>
                </div>
                <div className="bg-green-50 p-4 rounded">
                  <div className="text-sm text-gray-600">総問題数</div>
                  <div className="text-2xl font-bold text-green-700">{stats.total_questions_answered}</div>
                </div>
                <div className="bg-blue-50 p-4 rounded">
                  <div className="text-sm text-gray-600">平均スコア</div>
                  <div className="text-2xl font-bold text-blue-700">{stats.average_score.toFixed(1)}%</div>
                </div>
                <div className="bg-purple-50 p-4 rounded">
                  <div className="text-sm text-gray-600">最高スコア</div>
                  <div className="text-2xl font-bold text-purple-700">{stats.best_score.toFixed(1)}%</div>
                </div>
              </div>
              {stats.last_quiz_date && (
                <div className="mt-4 text-sm text-gray-600">
                  最終実施日: {new Date(stats.last_quiz_date).toLocaleString('ja-JP')}
                </div>
              )}
            </div>
          )}

          {/* 改善項目別統計 */}
          <div className="bg-white rounded-lg shadow p-6 mb-6">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-xl font-semibold">改善項目別の正答率</h2>
              <span className="text-xs text-gray-500">再度学習すると最新データが反映されます</span>
            </div>
            {improvementEntries.length === 0 ? (
              <div className="text-gray-600 text-center py-4">
                改善項目の学習データがまだありません
              </div>
            ) : (
              <div className="space-y-3">
                {improvementEntries.map((entry) => (
                  <div key={entry.label} className="border border-gray-200 rounded-lg p-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <div className="font-semibold text-gray-800">{entry.label}</div>
                        <div className="text-sm text-gray-500">正答 {entry.correct} / {entry.attempts}</div>
                      </div>
                      <div className="text-right">
                        <div className="text-2xl font-bold text-indigo-700">{entry.accuracy}%</div>
                        <span className={`inline-block mt-1 px-2 py-1 text-xs font-semibold rounded-full border ${entry.tone}`}>
                          {entry.status}
                        </span>
                      </div>
                    </div>
                    <div className="h-2 bg-gray-200 rounded mt-3 overflow-hidden">
                      <div className="h-full bg-indigo-500" style={{ width: `${entry.accuracy}%` }} />
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
          
          {/* 最近のセッション */}
          <div className="bg-white rounded-lg shadow p-6">
            <h2 className="text-xl font-semibold mb-4">最近のセッション</h2>
            {sessionHistory.length === 0 ? (
              <div className="text-gray-600 text-center py-4">
                まだセッションがありません
              </div>
            ) : (
              <div className="space-y-3">
                {sessionHistory.map((session, index) => (
                  <div key={index} className="border border-gray-200 rounded p-4">
                    <div className="flex justify-between items-center mb-2">
                      <div className="font-semibold">
                        セッション {sessionHistory.length - index}
                      </div>
                      <div className={`text-lg font-bold ${session.score_percentage >= 80 ? 'text-green-600' : session.score_percentage >= 60 ? 'text-yellow-600' : 'text-red-600'}`}>
                        {session.score_percentage.toFixed(1)}%
                      </div>
                    </div>
                    <div className="text-sm text-gray-600">
                      正解数: {session.correct_answers} / {session.total_questions}
                    </div>
                    <div className="text-xs text-gray-500 mt-1">
                      {new Date(session.session_end_ts).toLocaleString('ja-JP')}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // 総合評価ページ
    function FinalSummaryPage({ history, total, perSet, onRetry, onExit }) {
      const items = history?.[0]?.result?.rows?.map(r => r.item) || [];
      // 各項目の正答数（answered === correct）合計
      const perItemCorrect = {};
      for (const label of items) perItemCorrect[label] = 0;
      let perfectCount = 0;
      for (const entry of history) {
        const rows = entry.result.rows || [];
        let allCorrect = true;
        for (const row of rows) {
          const ok = !row.is_wrong; // answered === correct
          if (ok) perItemCorrect[row.item] = (perItemCorrect[row.item] || 0) + 1;
          if (!ok) allCorrect = false;
        }
        if (allCorrect) perfectCount += 1;
      }

      const sets = Math.ceil(total / perSet);
      const perfectRate = total > 0 ? Math.round((perfectCount / total) * 100) : 0;

      return (
        <div className="w-full max-w-3xl mx-auto pt-6 pb-28">
          <h1 className="text-2xl font-bold text-center mb-4">総合評価</h1>
          <div className="mb-6 text-center text-gray-700">全{sets}セット・合計{total}問の結果</div>

          {/* 各回答項目ごとの正答率 */}
          <h2 className="text-xl font-semibold mt-4 mb-2">各回答項目の正答率</h2>
          <div className="space-y-2">
            {items.map((label) => {
              const correct = perItemCorrect[label] || 0;
              const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
              return (
                <div key={label} className="bg-white p-3 rounded shadow">
                  <div className="flex justify-between text-sm">
                    <div className="font-medium">{label}</div>
                    <div className="text-gray-600">{correct}/{total}（{pct}%）</div>
                  </div>
                  <div className="h-2 bg-gray-200 rounded mt-1 overflow-hidden">
                    <div className="h-full bg-indigo-500" style={{ width: `${pct}%` }} />
                  </div>
                </div>
              );
            })}
          </div>

          {/* 全項目正解の問題数 */}
          <h2 className="text-xl font-semibold mt-6 mb-2">全項目で正解した問題</h2>
          <div className="bg-white p-4 rounded shadow text-center">
            <div className="text-3xl font-extrabold text-indigo-700 mb-1">{perfectCount}/{total}</div>
            <div className="text-gray-700">15問に占める割合: {perfectRate}%</div>
          </div>

          {/* フッターボタン */}
          <div className="fixed inset-x-0 bottom-0 z-30 bg-white/90 backdrop-blur border-t border-gray-200">
            <div className="w-full max-w-3xl mx-auto px-4 pt-3 pb-4 pb-[env(safe-area-inset-bottom)] flex gap-3">
              <button onClick={onExit} className="w-1/2 bg-gray-600 hover:bg-gray-700 text-white font-semibold px-6 py-3 rounded-full shadow">終了</button>
              <button onClick={onRetry} className="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-full shadow">再チャレンジ</button>
            </div>
          </div>
        </div>
      );
    }

    // ルートコンポーネント
    function App() {
      const [selected, setSelected] = useState([]);
      const [page, setPage] = useState("quiz"); // 'quiz' | 'evaluation' | 'final' | 'mypage'
      const [quiz, setQuiz] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [gradeResult, setGradeResult] = useState(null);
      const [allIds, setAllIds] = useState([]);
      const [plannedIds, setPlannedIds] = useState([]); // 今回のセッションで出すIDの順序（重複なし）
      const [currentIndex, setCurrentIndex] = useState(0); // plannedIds のインデックス
      const [history, setHistory] = useState([]); // { id, result }
      const [sessionStartTime, setSessionStartTime] = useState(null); // セッション開始時刻
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [idToken, setIdToken] = useState(null);

      const TOTAL_SETS = 3;
      const PER_SET = 5;
      const TOTAL_QUESTIONS = TOTAL_SETS * PER_SET; // 15
      
      // 認証チェック
      useEffect(() => {
        const checkAuth = async () => {
          let token = await AUTH_UTILS.ensureValidToken();

          if (!token) {
            token = await AUTH_UTILS.exchangeCodeForToken();
          }

          if (token) {
            setIdToken(token);
            setIsAuthenticated(true);
          } else {
            setIdToken(null);
            setIsAuthenticated(false);
          }
        };
        checkAuth();
      }, []);

      useEffect(() => {
        const handleTokenRefresh = (event) => {
          const detailProvided = event?.detail && Object.prototype.hasOwnProperty.call(event.detail, 'idToken');
          const latestIdToken = event?.detail?.idToken ?? window.sessionStorage.getItem('auth.idToken');
          if (latestIdToken) {
            setIdToken(latestIdToken);
            setIsAuthenticated(true);
          } else if (detailProvided) {
            setIdToken(null);
            setIsAuthenticated(false);
          }
        };

        window.addEventListener('auth:tokenRefreshed', handleTokenRefresh);
        return () => window.removeEventListener('auth:tokenRefreshed', handleTokenRefresh);
      }, []);

      const loadQuizById = async (id) => {
        try {
          setLoading(true);
          setError(null);
          const res = await fetch(`${API_BASE}/api/quiz/${id}`);
          if (!res.ok) throw new Error(`Failed to fetch quiz ${id}: ${res.status}`);
          const data = await res.json();
          setQuiz(data);
        } catch (e) {
          setError(e.message || 'クイズの取得に失敗しました');
        } finally {
          setLoading(false);
        }
      };

      // 重複なしサンプリング（Fisher-Yates）
      const sampleWithoutReplacement = (arr, n) => {
        const a = [...arr];
        const m = Math.min(n, a.length);
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a.slice(0, m);
      };

      useEffect(() => {
        const bootstrap = async () => {
          try {
            setLoading(true);
            setError(null);
            // セッション開始時刻を記録
            setSessionStartTime(new Date().toISOString());
            // まずIDリストを取得
            const r = await fetch(`${API_BASE}/api/quiz_ids`);
            if (!r.ok) throw new Error(`Failed to fetch ids: ${r.status}`);
            const ids = await r.json();
            setAllIds(ids);
            // 15問×重複なしの順序を決定
            const planned = sampleWithoutReplacement(ids, TOTAL_QUESTIONS);
            setPlannedIds(planned);
            setCurrentIndex(0);
            if (planned.length > 0) {
              await loadQuizById(planned[0]);
            } else {
              const res = await fetch(`${API_BASE}/api/quiz`);
              if (!res.ok) throw new Error(`Failed to fetch quiz: ${res.status}`);
              const data = await res.json();
              setQuiz(data);
            }
          } catch (e) {
            setError(e.message || '初期化に失敗しました');
          } finally {
            setLoading(false);
          }
        };
        bootstrap();
      }, []);

      const toggle = (item) => {
        setSelected((prev) =>
          prev.includes(item) ? prev.filter((i) => i !== item) : [...prev, item]
        );
      };

      const submit = async () => {
        if (!quiz) return;
        try {
          const res = await fetch(`${API_BASE}/api/grade`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ quiz_id: quiz.id, selected })
          });
          if (!res.ok) throw new Error(`Failed to grade: ${res.status}`);
          const result = await res.json();
          setGradeResult(result);
          // 履歴に追加
          setHistory((prev) => [...prev, { id: quiz.id, result }]);
          setPage("evaluation");
        } catch (e) {
          alert(e.message || '採点に失敗しました');
        }
      };
      const goNext = async () => {
        // 次の問題へ。最後なら総合評価へ。
        const nextIndex = currentIndex + 1;
        if (nextIndex < plannedIds.length) {
          try {
            await loadQuizById(plannedIds[nextIndex]);
          } finally {
            setCurrentIndex(nextIndex);
            setSelected([]);
            setGradeResult(null);
            setPage("quiz");
          }
        } else {
          // 最終問題完了時: セッションをサーバーに保存
          await saveSessionToServer();
          setPage("final");
        }
      };
      
      // セッション保存関数
      const saveSessionToServer = async () => {
        const token = await AUTH_UTILS.ensureValidToken();
        if (!token) {
          console.log('Not authenticated, skipping session save');
          setIsAuthenticated(false);
          setIdToken(null);
          return;
        }

        setIsAuthenticated(true);
        setIdToken(token);
        
        // 履歴から問題結果を構築
        const questions = history.map(item => {
          const { id, result } = item;
          // resultには { score, total, rows } が含まれる
          const rows = result?.rows || [];
          const isAllCorrect = result.score === result.total;

          return {
            question_id: id,
            user_answer: 'multiple_choice', // 複数選択式
            correct_answer: 'all_items_correct', // 全項目正解が正答
            is_correct: isAllCorrect,
            improvements: rows.map(row => ({
              label: row.item,
              answered: row.answered,
              correct: row.correct,
              is_correct: !row.is_wrong
            }))
          };
        });
        
        const sessionData = {
          session_start_ts: sessionStartTime || new Date().toISOString(),
          questions: questions
        };
        
        try {
          const response = await fetchWithAuth(`${API_BASE}/api/session/save`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(sessionData)
          });

          if (response.status === 401) {
            console.error('Failed to save session: token expired');
            setIsAuthenticated(false);
            setIdToken(null);
            return;
          }
          
          if (!response.ok) {
            console.error('Failed to save session:', response.status);
            return;
          }
          
          const result = await response.json();
          console.log('Session saved successfully:', result);
        } catch (error) {
          console.error('Error saving session:', error);
        }
      };

      const restart = async () => {
        // 再チャレンジ: 新しい順序で最初から
        const planned = sampleWithoutReplacement(allIds, TOTAL_QUESTIONS);
        setPlannedIds(planned);
        setHistory([]);
        setSelected([]);
        setGradeResult(null);
        setCurrentIndex(0);
        setSessionStartTime(new Date().toISOString()); // セッション開始時刻を記録
        setPage("quiz");
        if (planned.length > 0) await loadQuizById(planned[0]);
      };

      const exitApp = () => {
        // 可能ならウィンドウを閉じる。不可なら blank へ遷移。
        window.close();
        setTimeout(() => { try { location.href = 'about:blank'; } catch (e) {} }, 50);
      };

      // 進行状況オブジェクト
      const progressForQuiz = {
        current: history.length + 1,
        total: plannedIds.length || TOTAL_QUESTIONS,
        perSet: PER_SET,
      };
      const progressForEval = {
        current: history.length,
        total: plannedIds.length || TOTAL_QUESTIONS,
        perSet: PER_SET,
      };

      if (page === 'mypage') {
        return <MyPage idToken={idToken} onBackToQuiz={() => setPage('quiz')} />
      }
      if (page === 'quiz') {
        return <QuizPage 
          quiz={quiz} 
          selected={selected} 
          toggle={toggle} 
          submit={submit} 
          loading={loading} 
          error={error} 
          progress={progressForQuiz}
          onShowMyPage={isAuthenticated ? () => setPage('mypage') : null}
          isAuthenticated={isAuthenticated}
        />
      }
      if (page === 'evaluation') {
        const isLast = (history.length >= (plannedIds.length || TOTAL_QUESTIONS));
        return <EvaluationPage quiz={quiz} gradeResult={gradeResult} next={goNext} progress={progressForEval} isLast={isLast} />
      }
      return (
        <FinalSummaryPage
          history={history}
          total={plannedIds.length || TOTAL_QUESTIONS}
          perSet={PER_SET}
          onRetry={restart}
          onExit={exitApp}
        />
      );
    }

    // マウント
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
